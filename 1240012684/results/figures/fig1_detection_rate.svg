<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica,Arial,sans-serif">
<rect width="760" height="420" fill="#ffffff"/>
<text x="30" y="34" font-size="17" font-weight="bold" fill="#1a202c">Figure 1. Go built-in deadlock detector: detection rate</text>
<text x="30" y="55" font-size="12" fill="#4a5568">Fraction of trials where the runtime printed 'all goroutines are asleep - deadlock!'</text>
<line x1="90" y1="340.0" x2="730" y2="340.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="80" y="344.0" text-anchor="end" font-size="11" fill="#4a5568">0</text>
<line x1="90" y1="290.0" x2="730" y2="290.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="80" y="294.0" text-anchor="end" font-size="11" fill="#4a5568">20</text>
<line x1="90" y1="240.0" x2="730" y2="240.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="80" y="244.0" text-anchor="end" font-size="11" fill="#4a5568">40</text>
<line x1="90" y1="190.0" x2="730" y2="190.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="80" y="194.0" text-anchor="end" font-size="11" fill="#4a5568">60</text>
<line x1="90" y1="140.0" x2="730" y2="140.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="80" y="144.0" text-anchor="end" font-size="11" fill="#4a5568">80</text>
<line x1="90" y1="90.0" x2="730" y2="90.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="80" y="94.0" text-anchor="end" font-size="11" fill="#4a5568">100</text>
<line x1="90" y1="340" x2="730" y2="340" stroke="#4a5568"/>
<text x="20" y="72" font-size="12" fill="#1a202c">Trials detected (%)</text>
<rect x="130.0" y="90.0" width="80.0" height="250.0" fill="#c0392b" rx="3"/>
<text x="170.0" y="81.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">100%</text>
<text x="170.0" y="362.0" text-anchor="middle" font-size="12" fill="#1a202c">Buggy</text>
<rect x="290.0" y="340.0" width="80.0" height="0.0" fill="#1e7a46" rx="3"/>
<text x="330.0" y="331.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">0%</text>
<text x="330.0" y="362.0" text-anchor="middle" font-size="12" fill="#1a202c">Fix: move</text>
<rect x="450.0" y="340.0" width="80.0" height="0.0" fill="#2b6cb0" rx="3"/>
<text x="490.0" y="331.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">0%</text>
<text x="490.0" y="362.0" text-anchor="middle" font-size="12" fill="#1a202c">Fix: select</text>
<rect x="610.0" y="340.0" width="80.0" height="0.0" fill="#d97706" rx="3"/>
<text x="650.0" y="331.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a202c">0%</text>
<text x="650.0" y="362.0" text-anchor="middle" font-size="12" fill="#1a202c">Buggy + live</text>
</svg>
