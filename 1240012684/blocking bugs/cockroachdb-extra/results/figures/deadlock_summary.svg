<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#1a1a1a">cockroachdb gossip missing-unlock deadlock (commit 1cc69980)</text>
  <text x="20" y="52" font-size="13" fill="#555">20 runs each, executed in Linux (WSL2, Go 1.26.8). Native Go deadlock detector.</text>

  <!-- axes -->
  <line x1="90" y1="80" x2="90" y2="300" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="300" x2="640" y2="300" stroke="#333" stroke-width="1.5"/>
  <!-- y ticks -->
  <text x="78" y="304" font-size="11" fill="#333" text-anchor="end">0</text>
  <line x1="86" y1="300" x2="90" y2="300" stroke="#333"/>
  <text x="78" y="214" font-size="11" fill="#333" text-anchor="end">10</text>
  <line x1="86" y1="210" x2="90" y2="210" stroke="#999"/>
  <text x="78" y="124" font-size="11" fill="#333" text-anchor="end">20</text>
  <line x1="86" y1="120" x2="90" y2="120" stroke="#999"/>

  <!-- buggy group (centered ~ x=220) -->
  <text x="220" y="324" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">buggy</text>
  <!-- deadlock bar, height 180 for 20 -->
  <rect x="150" y="120" width="60" height="180" fill="#c0392b"/>
  <text x="180" y="112" font-size="12" fill="#c0392b" text-anchor="middle">20</text>
  <text x="180" y="290" font-size="10" fill="#fff" text-anchor="middle">deadlock</text>
  <text x="180" y="302" font-size="10" fill="#fff" text-anchor="middle">exit 2</text>

  <!-- fixed group (centered ~ x=460) -->
  <text x="460" y="324" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">fixed</text>
  <!-- clean bar -->
  <rect x="430" y="120" width="60" height="180" fill="#27ae60"/>
  <text x="460" y="112" font-size="12" fill="#27ae60" text-anchor="middle">20</text>
  <text x="460" y="290" font-size="10" fill="#fff" text-anchor="middle">clean</text>
  <text x="460" y="302" font-size="10" fill="#fff" text-anchor="middle">exit 0</text>

  <!-- legend -->
  <rect x="560" y="120" width="14" height="14" fill="#c0392b"/>
  <text x="580" y="131" font-size="11" fill="#333">deadlock (exit 2)</text>
  <rect x="560" y="142" width="14" height="14" fill="#27ae60"/>
  <text x="580" y="153" font-size="11" fill="#333">clean (exit 0)</text>

  <text x="20" y="348" font-size="11" fill="#777">Result: buggy 20/20 deadlock, fixed 20/20 clean. See results/raw/statistics.csv for per-run detail.</text>
</svg>
